# Cloudflare Pages Configuration for NuxtHub
# This app uses NuxtHub and should be deployed via Pages, not Workers

name = "atlas-inventory"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# Build output directory for Pages
pages_build_output_dir = "dist"

# D1 Database for application data
[[d1_databases]]
binding = "DB"
database_name = "atlas-inventory-db"
database_id = "5e4b4d66-726b-48f6-8ee7-796fe6abfae6"

# KV for caching and sessions
[[kv_namespaces]]
binding = "KV"
id = "eaa5b2a56c454c30a750527add58ece8"
